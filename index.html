<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e6def5">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工程カレンダー"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>工程カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: portal look. Navy ground with white cards: header, "近い予定" card, 3 menu tiles, then one white panel holding the screen. Calendar panel is a paper-style month sheet (big month number, mini next month, ruled grid). */
:root{
  --navy:#e6def5; --navy2:#d6cbee; --onnavy:#2b1f4a; --navy-mute:#65558a;
  --bg:#f1f4f9; --surface:#ffffff; --surface2:#e9edf5; --fg:#14213a; --muted:#56637c; --line:#d3dae7; --ink:#1b2233;
  --accent:#2c7a4b; --accent-fg:#ffffff; --accent-soft:#dcebdd; --warn:#b4432f; --gfg:#ffffff;
  --sun:#c0392b; --sat:#2a5fb0; --sun-tint:#fbe4e4; --sat-tint:#e0e9f8;
  --t-plant:#2c7a4b; --t-harvest:#b05a0c; --t-peel:#7d54a6; --t-tea:#8c5a2b;
  --t-soy:#2a74ad; --t-deliver:#c2185b; --t-black:#37474f; --t-honey:#c79100; --t-process:#00897b; --t-prep:#78909c; --t-care:#a1887f; --t-kizu:#b71c1c; --t-output:#6a8f2a; --t-limit:#3949ab; --t-vinegar:#9a7300; --t-ship:#157f86; --t-event:#c0392b; --t-task:#55646c;
  --head:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  --body:'BIZ UDPGothic','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
  --shadow:0 6px 18px rgba(70,45,130,.18);
}
*{box-sizing:border-box}
body{background:var(--navy);background-image:radial-gradient(circle at 12% 6%,rgba(255,255,255,.7),transparent 42%),radial-gradient(circle at 92% 55%,rgba(170,140,225,.28),transparent 44%);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:14px 110px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top :focus-visible,.menu :focus-visible{outline-color:var(--accent)}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--onnavy)}
.brand small{display:block;font:italic 400 11px/1 var(--head);letter-spacing:.18em;color:var(--navy-mute);margin-top:5px}
.welcome{text-align:right;font-size:12px;color:var(--navy-mute);line-height:1.3}
.welcome b{display:block;font:700 13px/1.3 var(--head);color:var(--onnavy)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack[hidden]{display:none}
.crow{display:flex;flex-direction:column;gap:10px;color:var(--onnavy)}
.crow-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.crow .btn{background:rgba(255,255,255,.75);border-color:transparent;color:var(--onnavy)}
.crow h2{font-size:28px;line-height:1.2;font-weight:900;overflow-wrap:anywhere}
.cos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.co{width:100%;min-height:76px;display:flex;align-items:center;gap:14px;background:var(--surface);color:var(--fg);border:0;border-radius:16px;padding:10px 14px;text-align:left;box-shadow:var(--shadow)}
.av{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--c);color:#fff;font:900 22px/1 var(--head)}
.co .rt b{font:900 18px/1.25 var(--head)}
.co .arrow{font:900 24px/1 var(--head);color:var(--muted)}
.panel{background:var(--surface);color:var(--fg);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.card{background:var(--surface);color:var(--fg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.ah{display:flex;align-items:center;gap:8px}.ah svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ah b{flex:1;font:700 14px/1.2 var(--head)}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ar{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:left}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.ar .rt b{font-size:14px}
.left{flex:none;font:700 12px/1 var(--head);color:var(--warn)}
.mh{font:700 12px/1 var(--head);letter-spacing:.1em;color:var(--navy-mute);margin:0 0 8px}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;background:var(--surface);color:var(--fg);border:2px solid transparent;border-radius:14px;min-height:96px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;text-align:left;box-shadow:var(--shadow)}
.tile .ic{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center}
.tile svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile b{font:700 14px/1.2 var(--head)}
.tile .tg{position:absolute;top:8px;right:8px;font:700 10px/1 var(--head);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 6px}
.tile[aria-current=page]{border-color:var(--accent)}
.tile[aria-current=page] .ic{background:var(--accent)}
.tile[aria-current=page] svg{stroke:var(--accent-fg)}
.brand{font:900 18px/1 var(--head);display:flex;align-items:center;gap:10px}
.brand .logo{width:48px;height:48px;object-fit:contain;flex:none}
.brand svg{width:26px;height:26px}

.eyebrow{font:700 13px/1 var(--head);letter-spacing:.08em;color:var(--muted);margin:0}
.hint{color:var(--muted);font-size:14px;margin:0}
.date-big{display:flex;flex-direction:column;gap:6px}
.date-big h1{font-size:34px;line-height:1.15;font-weight:900;font-variant-numeric:tabular-nums}
.progress{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--accent);background:transparent}
.dot.on{background:var(--accent)}

.glyph{display:inline-grid;place-items:center;flex:none;width:36px;height:36px;border-radius:9px;background:var(--c);color:var(--gfg);font:900 17px/1 var(--head)}
.glyph.big{width:56px;height:56px;border-radius:14px;font-size:26px}
.mk{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;background:var(--c);color:var(--gfg);font:900 10px/1 var(--head)}
.mk.d{opacity:.35}

.focus{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.fhead{display:flex;gap:14px;align-items:center}
.fhead h2{font-size:26px;line-height:1.25;font-weight:900}
.fhead p{margin:2px 0 0;color:var(--muted)}
.timer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer .lbl{font-size:14px;color:var(--muted);margin-inline-end:2px}
.tm{display:flex;align-items:center;gap:12px;width:100%;background:var(--accent-soft);border-radius:14px;padding:8px 8px 8px 16px}
.tm b{font:900 30px/1 var(--head);font-variant-numeric:tabular-nums;flex:1}
.btn{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 18px;font:700 16px/1 var(--head);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{min-height:66px;font-size:22px;border-radius:18px}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn:active{transform:scale(.97)}

.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.cnt{font:700 13px/1 var(--head);background:var(--surface2);border-radius:99px;padding:4px 9px;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 8px 5px 5px}
.chk{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;padding:0}
.chk i{width:30px;height:30px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;transition:background .15s}
.chk svg{width:16px;height:16px;opacity:0;stroke:var(--accent-fg)}
.done .chk i{background:var(--accent)}
.done .chk svg{opacity:1}
.rowmain{flex:1;min-width:0;min-height:48px;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 2px;text-align:left}
.rt{display:flex;flex-direction:column;min-width:0;flex:1}
.rt b{font-weight:700;overflow-wrap:anywhere}
.rt small{color:var(--muted);font-size:calc(14px*var(--fz,1));overflow-wrap:anywhere}
.done .rt b{text-decoration:line-through;color:var(--muted)}
.done .glyph{opacity:.45}
.dbadge{flex:none;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:8px;padding:3px 8px}
.dbadge.late{color:var(--warn)}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:21px}
.peek{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}

/* calendar (paper sheet) */
.chead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bigm{font:900 80px/.85 var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eng{display:flex;flex-direction:column;font:700 26px/1.08 var(--head);flex:1;min-width:90px}
.mini{display:flex;gap:6px;align-items:flex-start;background:none;border:0;padding:2px;color:var(--fg);text-align:left;border-radius:6px}
.ml{display:flex;flex-direction:column;align-items:flex-end;font-style:italic;line-height:1.1}
.ml i{font:900 italic 14px/1 var(--head)}.ml small{font-size:8px}
.mg{display:grid;grid-template-columns:repeat(7,11px);gap:1px 3px;font-size:8px;line-height:11px;text-align:center;font-variant-numeric:tabular-nums}
.mg b{font-weight:400}
.mg .su,.wd.su,.cell.su .dn{color:var(--sun)} .mg .sa,.wd.sa,.cell.sa .dn{color:var(--sat)}
.cnav{display:flex;gap:8px;align-items:center}
.cnav .btn{flex:1}
.nav{width:52px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:900 22px/1 var(--head);padding:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--ink);border:1.5px solid var(--ink)}
.wd{background:var(--surface);font:700 calc(12px*var(--fz,1))/1 var(--head);padding:4px 3px;text-align:left}
.cell{width:100%;min-height:calc(104px*var(--fz,1));border:0;border-radius:0;background:var(--surface);padding:3px 2px 4px;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;text-align:left;position:relative}
.cell.su{background:var(--sun-tint)} .cell.sa{background:var(--sat-tint)}
.cell.out{background:var(--surface)} .cell.out .dn{color:#b4b9c4}
.cell.today{outline:3px solid var(--accent);outline-offset:-3px;z-index:1}
.dh{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.cell .dn{font:700 calc(15px*var(--fz,1))/1 var(--head);font-variant-numeric:tabular-nums;min-width:20px;padding-inline:2px}
.cell.today .dn{background:var(--accent);color:var(--accent-fg);border-radius:99px;text-align:center}
.hol{font:700 8.5px/1.15 var(--head);color:var(--sun);overflow-wrap:anywhere;padding-inline:2px}
.mks{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-style:normal;font-size:calc(10.5px*var(--fz,1));line-height:1.2;font-weight:700;padding:2px 3px;border-radius:3px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 20%,#fff);overflow:hidden;overflow-wrap:anywhere}
.ev.d{opacity:.45;text-decoration:line-through}
.more{font:700 10px/1.2 var(--head);color:var(--muted);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.mk{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;background:var(--c);color:var(--gfg);font:900 10px/1 var(--head)}
/* tasks */
.qadd{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.qline{display:flex;gap:8px}
.qline input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=month],select{min-height:52px;width:100%;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font:700 14px/1 var(--head)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.dsub{font:700 13px/1 var(--head);color:var(--muted);margin:6px 0 0}
details.fin summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}

/* chrome */
.fab{position:fixed;z-index:21;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:60px;padding:0 22px 0 18px;border-radius:30px;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow);font:900 17px/1 var(--head);display:flex;align-items:center;gap:8px}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:3;stroke-linecap:round;fill:none}
.toast{position:fixed;left:50%;transform:translate(-50%,12px);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;background:#fff;color:var(--fg);box-shadow:var(--shadow);padding:12px 20px;border-radius:99px;font:700 16px/1.2 var(--head);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* sheet */
.bg{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:50}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-width:560px;margin:auto;max-height:90%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h2{font-size:22px;font-weight:900}
#eform.sheet{max-height:94%}
.sheet label,.sheet legend{font:700 14px/1 var(--head);color:var(--muted);display:block;margin-bottom:6px;padding:0}
.sheet fieldset{border:0;margin:0;padding:0;min-width:0}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tp{min-height:68px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 11px/1.2 var(--head);text-align:center}
.tp[aria-pressed=true]{border-color:var(--c);background:var(--surface2)}
.tp .glyph{width:30px;height:30px;font-size:15px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .primary{flex:1}
.err{color:var(--warn);font-size:14px;margin:6px 0 0}

.ev.ms{background:var(--c);color:#fff;border-left:0;font-weight:800}
.ev.agg{border-left-color:var(--muted);background:var(--surface2);color:var(--fg)}
.ev.agg.q{border-left-color:var(--t-plant);background:color-mix(in srgb,var(--t-plant) 18%,#fff);color:#1f5a38}
.sumg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{background:var(--surface);color:var(--fg);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.sum .big{display:block;font:900 36px/1.1 var(--head);font-variant-numeric:tabular-nums}
.sum .big small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.pbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crumb{font-size:13px;font-weight:700;color:var(--navy-mute);margin:0}
.stack>.sec h3{color:var(--onnavy)}
.stack>.sec>.hint{color:var(--navy-mute)}
.wsel{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--fg);border-radius:14px;padding:4px 14px;box-shadow:var(--shadow)}
.wsel span{flex:none;font:700 14px/1 var(--head);color:var(--muted)}
.wsel select{flex:1;min-width:0;border:0;background:transparent;font:800 19px/1.2 var(--head);min-height:52px;padding:0}
.totop{position:fixed;z-index:21;left:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:48px;padding:0 18px;border-radius:24px;border:0;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font:800 15px/1 var(--head);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.totop svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.xlb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.xlb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fl{display:flex;flex-direction:column;gap:4px}
.fgrp{align-self:flex-start;font:800 13px/1 var(--head);color:#fff;background:var(--c);border-radius:6px;padding:5px 10px;margin-top:6px}
.fs{background:var(--surface);border-left:6px solid var(--c);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 8px rgba(70,45,130,.1)}
.fs b{font:800 16px/1.3 var(--head)}
.fs small{color:var(--muted);font-size:13px}
.fs .rule{display:inline-block;margin-top:4px;background:var(--accent-soft);color:#1f5a38;font:700 13px/1.3 var(--head);border-radius:6px;padding:3px 8px}
.fa{text-align:center;color:var(--accent);font:900 18px/1 var(--head)}
.fcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.matimg{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.limrow{display:flex;align-items:center;gap:10px;font:700 14px/1.3 var(--head);padding:6px 0}
.limrow input{width:22px;height:22px;flex:none;min-height:0}
#home .cos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#home .cos li{display:flex}
#home .co{padding:10px;gap:10px;min-height:76px;align-items:center;height:100%}
#home .co .av{width:40px;height:40px;border-radius:12px;font-size:19px}
#home .co .arrow{display:none}
#home .co .rt b{font-size:calc(16px*var(--fz,1));line-height:1.25;overflow-wrap:anywhere}
#home .co .rt small{font-size:calc(12px*var(--fz,1));line-height:1.35}

<script>
const TYPES=[
  {id:'plant',s:'植',label:'植',g:'植',ph:'メモ（例: 区画 2-4）'},
  {id:'harvest',s:'収',label:'収',g:'収',ph:'メモ（例: 区画 8）'},
  {id:'peel',s:'皮',label:'皮',g:'皮',ph:'メモ（任意）'},
  {id:'tea',s:'皮茶',label:'皮茶',g:'茶',ph:'メモ（任意）'},
  {id:'soy',s:'醤油',label:'醤油',g:'醤',ph:'メモ（任意）'},
  {id:'vinegar',s:'酢',label:'酢',g:'酢',ph:'メモ（任意）'},
  {id:'black',s:'黒',label:'黒',g:'黒',ph:'メモ（任意）'},
  {id:'honey',s:'はちみつ',label:'はちみつ',g:'蜜',ph:'メモ（任意）'},
  {id:'process',s:'加工',label:'加工',g:'加',ph:'メモ（例: 袋詰め）'},
  {id:'kizu',s:'傷',label:'傷',g:'傷',ph:'メモ（任意）'},
  {id:'care',s:'世話',label:'世話',g:'世',ph:'メモ（任意）'},
  {id:'prep',s:'準備',label:'準備',g:'準',ph:'メモ（任意）'},
  {id:'output',s:'〇',label:'〇',g:'〇',ph:'メモ（任意）'},
  {id:'deliver',s:'納品',label:'納品',g:'納',ph:'メモ（例: 納品先・品名）'},
  {id:'ship',s:'出荷',label:'出荷',g:'荷',ph:'メモ（例: 発送先）'},
  {id:'limit',s:'〆',label:'〆（リミット）',g:'限',ph:'メモ（例: 完成させるもの）'},
  {id:'event',s:'予定',label:'予定',g:'行',ph:'行事の名前（例: 健診）'},
  {id:'task',s:'',label:'タスク',g:'タ',ph:'やること（例: 請求書を出す）'}
];
const T=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const WD=['日','月','火','水','木','金','土'];
const PRAISE=['できた！','いいね','1つ進んだ','ナイス','おつかれさま'];
const LS='ninniku-v1';

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const todayS=()=>ymd(new Date());
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'月'+d.getDate()+'日('+WD[d.getDay()]+')'};
const rel=s=>{const t=todayS();return s===t?'今日':s===addD(t,1)?'あした':s===addD(t,-1)?'きのう':md(s)};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- data ---------- */
function seed(){return normalize({updatedAt:0,items:[]})}
const DEF_CO=[];
function normalize(d){
  if(!d||!Array.isArray(d.items))d={updatedAt:0,items:[]};
  if(!Array.isArray(d.companies)||!d.companies.length)d.companies=DEF_CO.map(c=>({id:c.id,name:c.name}));
  const known=new Set(d.companies.map(c=>c.id));
  d.items.forEach(i=>{if(!i.cid||!known.has(i.cid))i.cid=d.companies.some(c=>c.id==='c-alba')?'c-alba':d.companies[0].id});
  d.items.forEach(i=>{const m=isGarlic(i.type)&&!i.num&&/^[(（]([0-9０-９\-－・,、]+)[)）]$/.exec(i.text||'');if(m){i.num=cleanNum(m[1]);i.text=''}});
  if(!d.mig2){d.mig2=1;d.items.filter(i=>i.type==='soy'&&/^s\d+$/.test(i.id)).forEach(i=>d.items.push({id:'v'+i.id,cid:i.cid,date:i.date,type:'vinegar',text:'',done:i.done,o:i.o+.5}))}
  if(!Array.isArray(d.workers))d.workers=[];
  if(!Array.isArray(d.xlGone))d.xlGone=[];
  if(!d.sample1){
    d.sample1=1;
    const co=d.companies.find(c=>c.id==='c-safety');
    if(co&&!d.workers.some(w=>w.cid===co.id)){
      const t=todayS(),W=[['w-sample-a','サンプルA'],['w-sample-b','サンプルB'],['w-sample-c','サンプルC']];
      W.forEach(w=>d.workers.push({id:w[0],cid:co.id,name:w[1]}));
      // [worker, dayOffset, type, num, goal, qty, done]
      const L=[['a',-2,'harvest','1-5',30,28,1],['a',-1,'peel','',50,50,1],['a',0,'peel','',50,20,0],['a',2,'plant','6-8',20,'',0],

  if(soon.length){
    h+='<section class="sec"><h3>これから <span class="cnt">'+soon.length+'</span></h3>';
    let last='';
    soon.forEach(i=>{if(i.date!==last){last=i.date;h+='<p class="dsub">'+(i.date===tm?'あした ':'')+md(i.date)+'</p>'}h+=list([i])});
    h+='</section>';
  }
  if(later.length)h+='<section class="sec"><h3>あとで <span class="cnt">'+later.length+'</span></h3>'+list(later,true)+'</section>';
  if(fin.length)h+='<details class="fin"><summary>最近できたこと（'+fin.length+'件）</summary>'+list(fin,true)+'</details>';
  return h;
}

function buildXlsx(scope){
  const wb=new ExcelJS.Workbook();wb.creator='工程カレンダー';wb.created=new Date();
  const co=coById(cid),wk=scope==='wk'?wById(wid):null;
  let items=scope==='all'?S.items.slice():S.items.filter(i=>i.cid===cid);
  if(scope==='wk')items=items.filter(i=>i.wid===wid||(i.wid===''&&isMS(i.type)));
  items=sortItems(items);
  const coN=id=>(S.companies.find(c=>c.id===id)||{name:'？'}).name;
  const wN=i=>i.wid?((wById(i.wid)||{}).name||'？'):'全体';
  const HEAD={font:{bold:true,color:{argb:'FFFFFFFF'}},fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF2C7A4B'}},alignment:{vertical:'middle',horizontal:'center',wrapText:true}};
  const THIN={style:'thin',color:{argb:'FFBFC7D1'}},BOX={top:THIN,left:THIN,bottom:THIN,right:THIN};
  const head=(ws,widths)=>{const h=ws.getRow(1);h.height=24;h.eachCell(c=>{Object.assign(c,HEAD);c.border=BOX});ws.columns.forEach((c,k)=>c.width=widths[k]);ws.views=[{state:'frozen',ySplit:1}];ws.autoFilter={from:{row:1,column:1},to:{row:1,column:ws.columns.length}}};
  // 1 予定一覧
  const w1=wb.addWorksheet('予定一覧');
  w1.columns=[{header:'企業'},{header:'従業員'},{header:'日付'},{header:'曜日'},{header:'種類'},{header:'番号'},{header:'内容・メモ'},{header:'目標(個)'},{header:'できた(個)'},{header:'状態'}];
  items.forEach(i=>{
    const row=w1.addRow([coN(i.cid),wN(i),i.date?xlDate(i.date):'',i.date?WD[parse(i.date).getDay()]:'',T[i.type].label,i.num||'',i.text||'',i.goal===''||i.goal==null?'':i.goal,i.qty===''||i.qty==null?'':i.qty,i.done?'完了':'未完了']);
    row.getCell(3).numFmt='yyyy/mm/dd';
    row.eachCell(c=>{c.border=BOX;c.alignment={vertical:'top',wrapText:true}});
    if(i.done)row.font={color:{argb:'FF7A8591'}};
  });
  head(w1,[18,16,12,6,12,12,34,10,12,10]);
  // 2 納期・リミット
  const w2=wb.addWorksheet('納期・リミット');
  w2.columns=[{header:'日付'},{header:'種類'},{header:'企業'},{header:'担当'},{header:'内容・メモ'},{header:'数量(個)'},{header:'状態'},{header:'残り日数'}];
  const today=new Date(),t0=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());
  items.filter(i=>isMS(i.type)&&i.date).forEach(i=>{
    const row=w2.addRow([xlDate(i.date),T[i.type].label,coN(i.cid),wN(i),i.text||'',i.qty===''||i.qty==null?'':i.qty,i.done?'完了':'未完了','']);
    const rn=row.number,left=Math.round((xlDate(i.date).getTime()-t0)/864e5);
    row.getCell(1).numFmt='yyyy/mm/dd';
    row.getCell(8).value={formula:'IF(G'+rn+'="完了","",A'+rn+'-TODAY())',result:i.done?'':left};
    row.getCell(8).numFmt='0';
    row.eachCell(c=>{c.border=BOX;c.alignment={vertical:'top',wrapText:true}});
  });
  head(w2,[12,12,18,16,34,10,10,10]);
  // 3 従業員別集計
  const w3=wb.addWorksheet('従業員別集計');
  w3.columns=[{header:'月'},{header:'企業'},{header:'従業員'},{header:'作業件数'},{header:'完了件数'},{header:'目標(個)'},{header:'できた(個)'},{header:'達成率'}];
  const agg={};
  items.filter(i=>i.date&&!isMS(i.type)).forEach(i=>{
    const k=i.date.slice(0,7)+'|'+coN(i.cid)+'|'+wN(i),a=agg[k]=agg[k]||{m:i.date.slice(0,7),c:coN(i.cid),w:wN(i),n:0,d:0,g:0,q:0};
    a.n++;if(i.done)a.d++;a.g+=Number(i.goal)||0;a.q+=Number(i.qty)||0;
  });
  Object.keys(agg).sort().forEach(k=>{
    const a=agg[k],row=w3.addRow([a.m.replace('-','年')+'月',a.c,a.w,a.n,a.d,a.g,a.q,'']),rn=row.number;
    row.getCell(8).value={formula:'IF(F'+rn+'=0,"",G'+rn+'/F'+rn+')',result:a.g?a.q/a.g:''};
    row.getCell(8).numFmt='0%';
    row.eachCell(c=>{c.border=BOX});
  });
  head(w3,[12,18,16,10,10,10,12,10]);
  // 4 月カレンダー
  if(scope!=='all'){

      const nd=Math.min(new Date(Y,M,0).getDate(),mx);if(!nd)continue;

      for(const rn of rowNums){

          for(let cn=3;cn<=2+nd;cn++){

function syApply(r,snap){

  }
  if(a==='sypw'){
    const v=(document.getElementById('sy-pass').value||'').trim();if(!v){toast('合言葉を入れてください');return}
    syPass=v;sySaveMeta();sheet=null;renderAll();await syncNow();if(!syOk&&syMsg.indexOf('合言葉')<0)toast('同期できませんでした');else if(syOk)toast('共有につながりました');
  }
  if(a==='gohome'){
    view='home';sheet=null;timer=null;renderAll();window.scrollTo(0,0);
    if(syUrl){await syncNow();toast(syOk?'更新しました':'更新できませんでした')}
  }
  if(a==='syref'){
    if(!syUrl){location.reload();return}
    el.disabled=true;await syncNow();el.disabled=false;toast(syOk?'更新しました':'更新できませんでした');
  }
  if(a==='sylink'){try{await navigator.clipboard.writeText(syLink());toast('共有リンクをコピーしました')}catch(_){toast('コピーできませんでした')}}
  if(a==='syoff'){syUrl='';syBase={};syRev=0;syInit=false;syMsg='';syOk=false;sySaveMeta();syLabel();sheet=null;renderAll();toast('共有をやめました')}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.id==='brandbtn'){e.preventDefault();e.target.click()}});
/* ---------- 文字の大きさ ---------- */
const FZ=[['標準',1],['大',1.2],['特大',1.4]];
let fzi=1;try{const v=localStorage.getItem('koutei-fz');if(v!==null&&FZ[+v])fzi=+v}catch(e){}
function fzApply(){document.documentElement.style.setProperty('--fz',FZ[fzi][1]);const b=document.getElementById('fzbtn');if(b)b.textContent='文字 '+FZ[fzi][0]}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act=fz]');if(!el)return;fzi=(fzi+1)%FZ.length;try{localStorage.setItem('koutei-fz',String(fzi))}catch(_){}fzApply()});
fzApply();
/* ---------- 予定の追加取り込み（上書きしない） ---------- */
let pendingAd=null;
const adNd=s=>(String(s==null?'':s).match(/\d+/g)||[]).join(',');
const adId=k=>{let h=5381;for(let i=0;i<k.length;i++)h=((h<<5)+h+k.charCodeAt(i))|0;return 'a'+(h>>>0).toString(36)};
function adPlan(f){
  const plan={add:[],same:0,diff:[],rem:[]};
  const have=new Map();
  S.items.forEach(i=>{const k=i.wid+'|'+i.date+'|'+i.type;if(!have.has(k))have.set(k,[]);have.get(k).push(i)});
  const findW=(cid,name)=>S.workers.find(w=>w.cid===cid&&w.name===name);
  (f.items||[]).forEach(r=>{
    const w=findW(r.cid,r.wname),ex=w?have.get(w.id+'|'+r.date+'|'+r.type):null;
    if(!ex){plan.add.push(r);return}
    if(!r.num||ex.some(i=>adNd(i.num)===adNd(r.num)))plan.same++;
    else plan.diff.push({who:r.wname,date:r.date,type:r.type,file:r.num,app:ex[0].num||''});
  });
  (f.remove||[]).forEach(r=>{const w=findW(r.cid,r.wname),ex=w?have.get(w.id+'|'+r.date+'|'+r.type):null;if(ex)ex.forEach(i=>plan.rem.push({id:i.id,who:r.wname,date:r.date,type:r.type,num:i.num||''}))});
  return plan;
}
function adApply(f){
  const plan=adPlan(f);
  (f.companies||[]).forEach(c=>{if(!S.companies.some(x=>x.id===c.id))S.companies.push({id:c.id,name:c.name})});
  plan.add.forEach((r,k)=>{
    let w=S.workers.find(x=>x.cid===r.cid&&x.name===r.wname);
    if(!w){w={id:'w'+uid(),cid:r.cid,name:r.wname};S.workers.push(w)}
    const id=adId([r.cid,r.wname,r.date,r.type,r.num].join('|'));
    if(S.items.some(i=>i.id===id))return;
    S.items.push({id,cid:r.cid,wid:w.id,date:r.date,type:r.type,text:r.text||'',num:r.num||'',goal:'',qty:'',done:r.date<todayS(),o:9000+k});
  });
  const rm=new Set(plan.rem.map(x=>x.id));
  if(rm.size)S.items=S.items.filter(i=>!rm.has(i.id));
  return plan;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='adin')document.getElementById('ad-file').click();
  if(el.dataset.act==='adok'&&pendingAd){const p=adApply(pendingAd);pendingAd=null;save();sheet=null;toast('予定を'+p.add.length+'件、追加しました');renderAll()}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='ad-file')return;
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  f.text().then(t=>{try{const o=JSON.parse(t);if(!o||o.kind!=='koutei-add'||!Array.isArray(o.items))throw 0;pendingAd=o;sheet={kind:'ad',plan:adPlan(o),rebuild:true};renderAll()}catch(_){toast('このファイルは読み込めません')}});
});

/* ---------- boot ---------- */
S=readLocal();S=S?normalize(S):seed();
renderAll();window.scrollTo(0,0);syncTop();
initDb();syncInit();
</script>
